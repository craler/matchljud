    $('#syNow').onclick = () => { $('#syRepo').onchange({ target: $('#syRepo') }); Sync.token = $('#syTok').value; if (!Sync.on) return toast('Fyll i både repo och nyckel.'); Sync.pull(true); };
  },
  backup() {
    openSheet('Backup', `<p class="hint">Läs in en backup från Sports Audio DJ (.sadj) eller från Matchljud (.json). Det som finns här nu ersätts.</p>
      <div class="row"><button class="btn primary" id="sImp">Läs in backup</button></div>
      <p class="hint" style="margin-top:22px">Spara allt i en fil, med ljudeffekterna inbakade.</p>
      <div class="row"><button class="btn" id="sExp">Spara backup</button></div>`, { back: () => openMenu() });
    $('#sImp').onclick = () => $('#fileImport').click();
    $('#sExp').onclick = exportBackup;
  },
};
// Walks through every function and group; one press binds it, "Hoppa över" leaves it as it is.
function padWizard(i) {
  const steps = [...ACTIONS.map(a => ({ action: a.id, name: a.name, hint: a.hint })), ...S.groups.map(g => ({ group: g, name: 'Slumpa ur ' + g.name }))];
  if (i >= steps.length) { Trig.learn = null; toast('Knapparna är inställda.'); return Menu.keypad(); }
  const st = steps[i], keys = st.action ? (S.binds[st.action] || []) : (st.group.trig || []);
  openSheet('Ställ in knapparna', `
    <p class="hint">Tryck på knappen som ska göra det här. Hoppa över det du inte behöver.</p>
    <div class="wiz"><small>${i + 1} av ${steps.length}</small><b>${esc(st.name)}</b><span id="wNow">${keys.length ? 'Nu: ' + esc(keys.map(k => Trig.label(k)).join(', ')) : esc(st.hint || 'Ingen knapp än')}</span></div>
    <div class="row"><button class="btn" id="wPrev" ${i ? '' : 'disabled'}>Föregående</button><button class="btn" id="wSkip">Hoppa över</button></div>
    <div class="row"><button class="btn primary" id="wDone">Klar</button></div>`, { back: () => { Trig.learn = null; Menu.keypad(); } });
  Trig.learn = { ...(st.action ? { action: st.action } : { group: st.group }), quiet: true,
    done: key => { const el = $('#wNow'); if (el) el.textContent = 'Kopplad: ' + Trig.label(key); setTimeout(() => { if (sheetOpen() && $('#wNow')) padWizard(i + 1); }, 450); } };
  $('#wPrev').onclick = () => padWizard(i - 1);
  $('#wSkip').onclick = () => padWizard(i + 1);
  $('#wDone').onclick = () => { Trig.learn = null; Menu.keypad(); };
}
function openMenu(page = 'root') { sheetHook = null; Trig.learn = null; (Menu[page] || Menu.root)(); }

/* ---------------- import / export ---------------- */
async function readZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), files = {}, dec = new TextDecoder();
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('filen är inte en backup');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen)); p += 46 + nlen + elen + clen;
    if (name.endsWith('/')) continue;
    const at = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    const raw = u8.slice(at, at + csize);
    files[name] = method === 0 ? raw : method === 8 ? new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()) : null;
  }
  return files;
}
const SADJ_COLOR = { '-1': 0, 0: 7, 1: 1, 2: 2, 3: 5, 4: 3, 5: 3, 6: 6, 7: 4 };
const sadjKey = k => (/^[0-9]$/.test(k || '') ? ['k|Digit' + k] : /^[a-z]$/i.test(k || '') ? ['k|Key' + k.toUpperCase()] : []);
const sadjVol = v => (v >= 0 ? Math.round(clamp(v <= 1 ? v * 100 : v <= 10 ? v * 10 : v, 0, 100)) : -1);
async function importSadj(files) {
  const mk = Object.keys(files).find(n => /manifest\.json$/.test(n)); if (!mk) throw new Error('backupen saknar innehållsförteckning');
  const m = JSON.parse(new TextDecoder().decode(files[mk]));
  const st = defaultState(); st.groups = []; const audio = {}; let missing = 0;
  const as = m.appSettings || {};
  st.settings.fadeOut = as.fadeOutSec ?? 2; st.settings.fadeIn = as.fadeInSec ?? 0; st.settings.markPlayed = as.useHasPlayedMarking ?? true;
  const sounds = {}; (m.sounds || []).forEach(s => { sounds[s.soundUUID] = s; });
  for (const g of (m.playbackGroups || []).slice().sort((a, b) => a.orderIndex - b.orderIndex)) {
    const gid = uid(); st.groups.push({ id: gid, name: g.groupName, trig: sadjKey(g.hotKey) });
    (m.playbacks || []).filter(p => p.groupUUID === g.playbackGroupUUID).sort((a, b) => a.orderIndex - b.orderIndex).forEach((p, i) => {
      const s = sounds[p.soundUUID]; if (!s) { missing++; return; }
      const dur = s.playbackDuration || 0;
      let stop = (p.stopAtSeconds || 0) + (p.stopAtSubSec || 0); if (!stop || (dur && stop >= dur - 0.05)) stop = null;
      const t = { id: uid(), groupId: gid, order: i, title: (p.displayTitle || s.title || '').replace(/\.(wav|mp3|m4a|aiff?|caf|aac)$/i, ''), alt: p.altTitle || '', artist: s.artist || '', duration: dur,
        start: (p.startAtSeconds || 0) + (p.startAtSubSec || 0), stop, color: SADJ_COLOR[p.songCellColor] ?? 0, volume: sadjVol(p.volume),
        fadeIn: p.fadeInSeconds >= 0 ? p.fadeInSeconds : -1, fadeOut: p.fadeOutSeconds >= 0 ? p.fadeOutSeconds : -1,
        next: !!p.willPlayNextSound, played: !!p.hasBeenPlayed, loop: p.loopCount > 0 ? p.loopCount : 0, trig: sadjKey(p.hotKey) };
      if (s.trackID) { t.kind = 'spotify'; t.uri = 'spotify:track:' + s.trackID; t.overlay = false; }
      else {
        const fname = s.localFileName || (s.soundUUID + '.wav'); const key = Object.keys(files).find(n => n === fname || n.endsWith('/' + fname));
        if (!key || !files[key]) { missing++; return; }
        t.kind = 'local'; t.soundId = s.soundUUID; t.overlay = true; t.next = false; t.loop = 0; audio[s.soundUUID] = files[key].buffer;
      }
      st.tiles.push(t);
    });
  }
  if (!st.groups.length) throw new Error('backupen innehåller inga grupper');
  st.curGroup = st.groups[0].id;
  return { st, audio, missing };
}
async function importOwn(j) {
  const st = j && j.state; if (!st || !Array.isArray(st.groups) || !st.groups.length) throw new Error('filen är inte en backup från Matchljud');
  const audio = {}; for (const [k, v] of Object.entries(j.audio || {})) audio[k] = await (await fetch(v)).arrayBuffer();
  return { st: { ...defaultState(), ...st, settings: { ...defaultState().settings, ...st.settings } }, audio, missing: 0 };
}
async function applyImport({ st, audio, missing }) {
  Engine.stopAll();
  await DB.clear('audio'); for (const [k, b] of Object.entries(audio)) await DB.put('audio', k, b);
  AudioL.buffers.clear(); S = st; await DB.put('kv', 'state', S);
  lpPage = 0; applyTileSize(); UI.build(); AudioL.preload(); Sync.schedule();
  toast(`${S.tiles.length} rutor i ${S.groups.length} grupper lästes in.` + (missing ? ` ${missing} ljud saknades i backupen.` : ''), 4500);
}
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const buf = await f.arrayBuffer(), head = new Uint8Array(buf, 0, 2);
    const res = head[0] === 0x50 && head[1] === 0x4B ? await importSadj(await readZip(buf)) : await importOwn(JSON.parse(new TextDecoder().decode(buf)));
    if (S.tiles.length && !confirm(`Ersätta dina ${S.tiles.length} rutor med backupens ${res.st.tiles.length}?`)) return;
    await applyImport(res); closeSheet();
  } catch (err) { console.error(err); toast('Backupen gick inte att läsa in: ' + (err instanceof SyntaxError ? 'filen är inte en backup' : err.message) + '.', 6000); }
};
async function exportBackup() {
  const audio = {};
  for (const id of new Set(S.tiles.filter(t => t.kind === 'local').map(t => t.soundId))) {
    const b = await audioBytes(id);
    if (b) audio[id] = 'data:application/octet-stream;base64,' + bytesToB64(b);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'matchljud', exported: new Date().toISOString(), state: S, audio })], { type: 'application/json' }));
  a.download = 'matchljud-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
// Sound files nobody uses any more (deleted tiles) are cleaned out on the next start, so Undo keeps working until then.
async function cleanAudio() {
  try { const used = new Set(S.tiles.filter(t => t.kind === 'local').map(t => t.soundId)); for (const k of await DB.keys('audio')) if (!used.has(k)) await DB.del('audio', k); } catch (e) {}
}

/* ---------------- sync between devices (a private GitHub repo holds setup.json and the sound files) ---------------- */
const Sync = {
  get repo() { return localStorage.getItem('sy_repo') || ''; },
  set repo(v) { localStorage.setItem('sy_repo', v.trim().replace(/^https:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '')); },
  get token() { return localStorage.getItem('sy_tok') || ''; },
  set token(v) { localStorage.setItem('sy_tok', v.trim()); },
  get on() { return !!(this.repo && this.token); },
  status: '', timer: 0, busy: false, applying: false,
  hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); },
  // What travels between devices. Played marks, tile size and MIDI ports stay on each device.
  shared() {
    const st = S.settings;
    return { app: 'matchljud', version: 2, spClient: SP.clientId, groups: S.groups, binds: S.binds, tiles: S.tiles.map(({ played, ...r }) => r),
      settings: { fadeOut: st.fadeOut, fadeIn: st.fadeIn, musicVol: st.musicVol, sfxVol: st.sfxVol, markPlayed: st.markPlayed, keepAlive: st.keepAlive, silentUri: st.silentUri } };
  },
  localHash() { return this.hash(JSON.stringify(this.shared())); },
  setStatus(m) { this.status = m; const el = $('#syStat'); if (el) el.textContent = m; },
  explain(e) { return /^(401|403|404)$/.test(e.message) ? (e.message === '401' ? 'Nyckeln godkändes inte.' : 'Nyckeln kommer inte åt repot. Kontrollera repo-namnet och att nyckeln får läsa och skriva.') : /^\d+$/.test(e.message) ? 'GitHub svarade med fel ' + e.message + '.' : 'Ingen kontakt med GitHub. Försöker igen senare.'; },
  async gh(path, opt = {}, raw, ms = 12000) {
    const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), ms);
    try {
      return await fetch('https://api.github.com/repos/' + this.repo + '/contents/' + path, { ...opt, cache: 'no-store', signal: ac.signal,
        headers: { Authorization: 'Bearer ' + this.token, Accept: raw ? 'application/vnd.github.raw' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) } });
    } finally { clearTimeout(timer); }
  },
  b64enc(str) { return bytesToB64(new TextEncoder().encode(str).buffer); },
  b64dec(b64) { const bin = atob(b64.replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); },
  schedule() { if (!this.on || this.applying) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 4000); },
  async pull(manual) {
    if (!this.on || this.busy) return;
    if (!manual && (sheetOpen() || moving)) return;   // never swap the setup under someone who is editing
    this.busy = true;
    try {
      this.setStatus('Hämtar…');
      const r = await this.gh('setup.json');
      if (r.status === 404) { this.busy = false; return this.push(true); }
      if (!r.ok) throw new Error(String(r.status));
      const j = await r.json();
      const dirty = this.localHash() !== localStorage.getItem('sy_hash');
      if (j.sha === localStorage.getItem('sy_sha')) { this.busy = false; if (dirty) return this.push(); this.setStatus('Synkad'); return; }
      if (dirty && S.tiles.length && !confirm('Upplägget har ändrats både här och på en annan enhet.\n\nOK: hämta den andra enhetens version. Ändringarna här försvinner.\nAvbryt: behåll den här versionen och skriv över den andra.')) {
        localStorage.setItem('sy_sha', j.sha); this.busy = false; return this.push(true);
      }
      await this.apply(JSON.parse(this.b64dec(j.content)), j.sha);
      this.setStatus('Synkad');
      toast('Upplägget hämtades från din andra enhet.');
    } catch (e) { console.warn(e); this.setStatus(this.explain(e)); if (manual) toast(this.explain(e), 5000); }
    this.busy = false;
  },
  async apply(rem, sha) {
    this.applying = true;
    try {
      const played = new Map(S.tiles.map(t => [t.id, t.played]));
      S.groups = Array.isArray(rem.groups) && rem.groups.length ? rem.groups : S.groups;
      S.tiles = (rem.tiles || []).map(t => ({ ...t, played: !!played.get(t.id) }));
      S.settings = { ...S.settings, ...(rem.settings || {}) };
      if (rem.binds) S.binds = rem.binds;
      if (rem.spClient && !SP.clientId) SP.clientId = rem.spClient;
      if (!group(S.curGroup)) S.curGroup = S.groups[0].id;
      if (Engine.cur) { const nt = tile(Engine.cur.tile.id); if (nt) Engine.cur.tile = nt; }
      const have = new Set(await DB.keys('audio')), up = new Set(JSON.parse(localStorage.getItem('sy_audio') || '[]'));
      for (const id of new Set(S.tiles.filter(t => t.kind === 'local').map(t => t.soundId))) {   // fetch sounds this device lacks
        up.add(id); if (have.has(id)) continue;
        const r = await this.gh('audio/' + id, {}, true, 60000); if (r.ok) { await DB.put('audio', id, await r.arrayBuffer()); AudioL.buffers.delete(id); }
      }
      localStorage.setItem('sy_audio', JSON.stringify([...up]));
      await DB.put('kv', 'state', S);
      localStorage.setItem('sy_sha', sha); localStorage.setItem('sy_hash', this.localHash());
      UI.build(); AudioL.preload();
    } finally { this.applying = false; }
  },
  async push(force) {
    if (!this.on || this.busy) return;
    const h = this.localHash(); if (!force && h === localStorage.getItem('sy_hash')) return;
    this.busy = true; this.setStatus('Sparar…');
    try {
      const up = new Set(JSON.parse(localStorage.getItem('sy_audio') || '[]'));
      for (const id of new Set(S.tiles.filter(t => t.kind === 'local').map(t => t.soundId))) {   // new sound files first
        if (up.has(id)) continue; const b = await audioBytes(id); if (!b) continue;
        const r = await this.gh('audio/' + id, { method: 'PUT', body: JSON.stringify({ message: 'ljud ' + id, content: bytesToB64(b) }) }, false, 90000);
        if (!(r.ok || r.status === 422 || r.status === 409)) throw new Error(String(r.status));   // 422/409: it is already there
        up.add(id); localStorage.setItem('sy_audio', JSON.stringify([...up]));
      }
      const body = { message: 'setup ' + new Date().toISOString(), content: this.b64enc(JSON.stringify(this.shared(), null, 1)) };
      const sha = localStorage.getItem('sy_sha'); if (sha) body.sha = sha;
      const r = await this.gh('setup.json', { method: 'PUT', body: JSON.stringify(body) }, false, 30000);
      if (r.status === 409 || r.status === 422) { this.busy = false; localStorage.removeItem('sy_hash'); return this.pull(true); }   // another device saved first
      if (!r.ok) throw new Error(String(r.status));
      const j = await r.json(); localStorage.setItem('sy_sha', j.content.sha); localStorage.setItem('sy_hash', h);
      this.setStatus('Synkad');
    } catch (e) { console.warn(e); this.setStatus(this.explain(e)); }
    this.busy = false;
  },
};

/* ---------------- the back button ----------------
   On a phone, Back (or a stray swipe from the screen edge) would close the app and kill the music.
   Instead it closes whatever is open, and leaving takes two presses. */
const Back = {
  on: false, asked: 0,
  arm() {   // must happen after a real tap: Chrome ignores history entries a page adds on its own
    if (this.on || !(matchMedia('(display-mode: standalone)').matches || matchMedia('(pointer: coarse)').matches)) return;
    this.on = true; history.pushState({ guard: 1 }, '');
    window.addEventListener('popstate', () => this.pressed());
  },
  pressed() {
    if (sheetOpen()) closeSheet();
    else if (moving) endMove();
    else if (Brush.on) Brush.toggle(false);
    else if (searchQ !== null) closeSearch();
    else if (editMode) $('#btnEdit').click();
    else if (Date.now() - this.asked < 2500) return history.back();
    else { this.asked = Date.now(); toast('Tryck tillbaka en gång till för att stänga appen.'); }
    history.pushState({ guard: 1 }, '');
  },
};

/* ---------------- new versions ----------------
   The app starts from its cached copy and the service worker fetches the newest one in the background.
   If that turned out to be different, offer a reload. Never reload by itself: there may be a match on. */
const Update = {
  told: false, last: 0,
  async check() {
    try {
      const note = await (await caches.open('matchljud-app')).match(new URL('__update', location.origin + location.pathname.replace(/index\.html$/, '')).href);
      if (!note || this.told || !(+(await note.text()) > performance.timeOrigin)) return;
      this.told = true;
      toast('En ny version av Matchljud är hämtad.', { action: 'Ladda om', onAction: () => location.reload(), ms: 20000 });
    } catch (e) {}
  },
  // An installed app can stay open for days: look for a new version when it comes back to the front.
  poke() { if (!navigator.serviceWorker || !navigator.serviceWorker.controller || Date.now() - this.last < 30 * 60 * 1000) return; this.last = Date.now(); fetch('./').catch(() => {}); setTimeout(() => this.check(), 4000); },
};

/* ---------------- keep the screen on ---------------- */
let wakeLock = null;
async function wake() {
  try {
    if (S.settings.keepAwake && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } else if (!S.settings.keepAwake && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  wake(); if (LP.connected) { LP.programmerMode(); LP.render(); }
  Sync.pull(false); Update.poke();
});
window.addEventListener('pagehide', () => { if (LP.connected) LP.liveMode(); });   // hand the Launchpad back when the app closes
window.addEventListener('pageshow', e => { if (e.persisted && LP.connected) { LP.programmerMode(); LP.render(); } });

/* ---------------- start ---------------- */
(async function boot() {
  await DB.open();
  const saved = await DB.get('kv', 'state');
  if (saved && Array.isArray(saved.groups) && saved.groups.length) S = { ...defaultState(), ...saved, settings: { ...defaultState().settings, ...saved.settings } };
  if (!group(S.curGroup)) S.curGroup = S.groups[0].id;
  applyTileSize(); UI.build(); renderStatus();
  // Browsers only allow sound after a real tap or key press; these are the events that count as one.
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, e => { if (ev !== 'pointerdown' || e.pointerType === 'mouse') gesture = true; SP.activate(); AudioL.ensure(); wake(); if (ev !== 'pointerdown') Back.arm(); }, { capture: true, passive: true });
  try { await SP.handleRedirect(); } catch (e) { toast('Spotify-inloggningen misslyckades: ' + e.message, 6000); }
  UI.build(); renderStatus();
  if (SP.loggedIn) SP.initPlayer();
  LP.connect(false);
  AudioL.preload(); wake();
  cleanAudio().then(() => Sync.pull(false));   // in the background: a slow network must never delay the player
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    Update.last = Date.now(); setTimeout(() => Update.check(), 3000);
  }
})();
</script>
