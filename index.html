<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<title>Matchljud</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
/* Pads are loud, the chassis is quiet: all colour belongs to the user's tiles.
   Type is the device's own screen font (Roboto on Android, San Francisco on Apple): legible at any size, nothing to download. */
:root{
  --chassis:#121316; --deck:#1A1C21; --raised:#262930; --line:#32353E;
  --text:#F2F3F5; --muted:#9DA3B0; --dim:#666B7A;
  --ok:#46D08A; --warn:#FFC53D; --bad:#FF6B70;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tile:108px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--chassis);color:var(--text);font:15px/1.35 var(--ui);overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  display:grid;height:100dvh;grid-template:"head" auto "note" auto "main" minmax(0,1fr) "deck" auto / minmax(0,1fr)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* controls */
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--raised)}
.iconbtn:disabled{opacity:.3}
.iconbtn[aria-pressed=true]{background:var(--text);color:var(--chassis)}
.btn{min-height:44px;padding:0 14px;border-radius:12px;background:var(--raised);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{filter:brightness(1.25)}
.btn.primary{background:var(--text);color:var(--chassis)}
.btn.danger{background:none;box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad)}
.btn.small{min-height:38px;padding:0 10px;font-size:14px}
.btn.square{width:44px;padding:0}
.btn.square[aria-pressed=true]{background:var(--ok);color:#04200F}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;filter:none}

/* header */
#head{grid-area:head;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px}
#title{font:700 24px/1.1 var(--ui);letter-spacing:-.01em;margin:0 6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q{flex:1;min-width:0;height:44px;margin:0 2px}
#status{display:flex;align-items:center;gap:7px;height:44px;padding:0 8px;border-radius:12px;color:var(--dim);font-size:13px;font-weight:600;flex:none}
#status svg{width:18px;height:18px}
#status .ok{color:var(--ok)} #status .warn{color:var(--warn)} #status .bad{color:var(--bad)}
#status .msg{display:none}
#banner{grid-area:note;display:flex;align-items:center;gap:10px;margin:0 10px 8px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--text);color:var(--chassis);font-weight:600}
#banner span{flex:1}
#brush{grid-area:note;display:flex;align-items:flex-start;gap:8px;margin:0 10px 8px;padding:8px;border-radius:14px;background:var(--deck);border:1px solid var(--line)}
.brush-tools{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.brush-tools .swatch{width:34px;height:34px;border-radius:9px}
.brush-tools .btn{min-height:34px;padding:0 10px;font-size:13px}
.brush-tools .btn[aria-pressed=true]{background:var(--text);color:var(--chassis)}
body.painting .tile[data-t],body.painting .horn{touch-action:none;cursor:crosshair}
#banner .btn{background:var(--chassis);color:var(--text)}

/* tile grid */
#main{grid-area:main;overflow-y:auto;padding:6px 10px 12px;overscroll-behavior:contain}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:10px}
.tile{position:relative;isolation:isolate;aspect-ratio:1;border-radius:12px;padding:9px 10px 8px;display:flex;flex-direction:column;text-align:left;overflow:hidden;
  color:var(--ink);-webkit-touch-callout:none;transition:transform .08s,box-shadow .2s,filter .2s;
  background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--pad) 70%,#fff) 0%,var(--pad) 55%,color-mix(in srgb,var(--pad) 72%,#000) 100%);
  box-shadow:0 0 18px -4px color-mix(in srgb,var(--pad) 75%,transparent),inset 0 1px 0 #ffffff59,inset 0 -3px 0 #00000040,inset 0 0 0 1px #ffffff1f}
/* the frosted top of a pad: a soft sheen over the light underneath */
.tile::after,.horn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,#ffffff2e,#ffffff00 42%);z-index:-1}
.tile:active{transform:scale(.96);filter:brightness(1.12)}
.tile-title{font:700 15px/1.18 var(--ui);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-sub{font-size:11px;line-height:1.25;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.tile-foot{margin-top:auto;display:flex;align-items:flex-end;gap:5px;min-height:16px}
.tile-time{font:700 14px/1 var(--ui);font-variant-numeric:tabular-nums}
.tile-flags{display:flex;gap:3px;opacity:.85}
.tile-flags svg{width:13px;height:13px;stroke-width:2.5}
.tile-key{margin-left:auto;min-width:0;max-width:62%;overflow:hidden;font:600 11px/1 var(--ui);opacity:.75;white-space:nowrap}
kbd{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font:700 11px/1 var(--ui);padding:2px 5px;border-radius:5px;box-shadow:inset 0 0 0 1.5px currentColor}
.wiz{margin:16px 0 6px;padding:26px 16px;border-radius:16px;background:var(--chassis);text-align:center}
.wiz small{display:block;color:var(--muted)}
.wiz b{display:block;font:700 30px/1.1 var(--ui);margin:8px 0}
.wiz span{color:var(--muted)}
.tile-drain{position:absolute;inset:0;z-index:-1;background:#0000004d;transform-origin:left;transform:scaleX(0);pointer-events:none}
/* played = lamp off: dark pad, colour only on the edge, title still fully readable */
/* played = lamp off: a dark pad with only a trace of its colour, title still readable */
.tile.is-played{background:color-mix(in srgb,var(--pad) 8%,#141619);color:#ffffff66;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pad) 24%,transparent)}
.tile.is-played::after{opacity:.15}
.tile.is-played .tile-sub{opacity:.7}
/* the one thing that moves: the playing pad drains like a game clock */
/* playing = full brightness, a white rim and a halo that breathes */
.tile.is-live{z-index:1;filter:brightness(1.12) saturate(1.1);animation:breathe 1.6s ease-in-out infinite;
  box-shadow:0 0 0 3px #fff,0 0 28px 4px color-mix(in srgb,var(--pad) 85%,transparent),inset 0 1px 0 #ffffff70}
.tile.is-live .tile-time{font-size:24px}
.tile.is-live .tile-sub{display:none}
.tile.is-loading{animation:none;filter:brightness(.8)}
.tile.is-fading{animation:none;opacity:.55}
.tile.is-sounding{filter:brightness(1.35);box-shadow:0 0 0 3px #fff,0 0 30px 6px #fff8}
.tile.is-lifted{opacity:.3}
.tile.slot{background:none;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line);align-items:center;justify-content:center;font-weight:600;text-align:center}
@keyframes breathe{50%{box-shadow:0 0 0 3px #fff,0 0 44px 12px color-mix(in srgb,var(--pad) 95%,transparent),inset 0 1px 0 #ffffff70}}
body.editing .tile[data-t],body.moving .tile[data-t]{outline:2px dashed #ffffffb0;outline-offset:-6px}
/* drag to reorder (edit mode) */
.drag-ghost{position:fixed;z-index:60;pointer-events:none;margin:0;opacity:.92;box-shadow:0 14px 34px #000c;transition:none}
.tile.drop-before,.horn.drop-before{box-shadow:-6px 0 0 -1px #fff}
.tile.drop-after,.horn.drop-after{box-shadow:6px 0 0 -1px #fff}
body.dragging{cursor:grabbing}
/* "Som Launchpad": 8 pads per row, 7 rows per page, exactly as on the device */
/* "Som Launchpad": the screen becomes the device. One page at a time: top-row buttons, 7 rows of tiles,
   the horn row at the bottom, the side buttons on the right. Sized to fit the window, never wider. */
body.lp-layout #grid{display:block}
body.lp-layout #horns{display:none}
.vlp{container-type:inline-size;display:grid;grid-template-columns:repeat(8,minmax(0,1fr)) .62fr;grid-template-rows:repeat(9,auto);gap:clamp(3px,.8cqw,8px);
  width:min(100%,calc(100dvh - 96px));margin:0 auto;padding:clamp(6px,1.4cqw,16px);border-radius:clamp(10px,2cqw,22px);background:#0b0c0e;box-shadow:inset 0 0 0 1px var(--line)}
.vlp .tile{aspect-ratio:1;padding:clamp(3px,.8cqw,8px);border-radius:clamp(5px,1cqw,10px)}
.vlp .tile-title{font-size:clamp(8.5px,1.75cqw,16px);line-height:1.12;-webkit-line-clamp:3;letter-spacing:0;overflow-wrap:break-word;hyphens:auto}
.vlp .tile-sub,.vlp .tile-flags,.vlp .tile-key{display:none}
.vlp .tile-time,.vlp .tile.is-live .tile-time{font-size:clamp(8px,1.5cqw,14px)}
.vlp .tile.slot{box-shadow:inset 0 0 0 1px #ffffff10;background:#16181c}
.vlp .tile.horn-pad .tile-time{display:none}
.vlp-btn{align-self:center;justify-self:center;width:min(84%,clamp(26px,6cqw,60px));aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
  font:700 clamp(7px,1.15cqw,12px)/1.05 var(--ui);color:#000c;background:var(--c,#2a2d35);box-shadow:0 0 12px -3px var(--c,transparent),inset 0 1px 0 #ffffff55;overflow:hidden;padding:2px}
.vlp-btn.off{background:#24262c;color:var(--dim);box-shadow:none}
.vlp-btn:active{transform:scale(.92)}
.vlp-logo{align-self:center;justify-self:center;color:var(--muted);font:600 clamp(8px,1.3cqw,13px)/1.1 var(--ui);text-align:center}
#btnLayout{display:none}
@media (min-width:700px){#btnLayout{display:grid}}
body.size-s .tile{padding:7px 8px 6px;border-radius:12px}
body.size-s .tile-title{font-size:13px}
body.size-s .tile-sub{display:none}
body.size-l .tile-title{font-size:19px}
body.size-l .tile-sub{font-size:12.5px}
.empty{grid-column:1/-1;max-width:460px;margin:8vh auto 0;color:var(--muted)}
.empty h2{font:700 26px/1.1 var(--ui);color:var(--text);margin:0 0 8px}
.empty ol{list-style:none;padding:0;margin:18px 0 0;counter-reset:s}
.empty li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:4px 10px;padding:14px 0;border-top:1px solid var(--line)}
.empty li>*{grid-column:2;justify-self:start}
.empty li::before{content:counter(s);grid-column:1;grid-row:1/span 6;font:700 22px/1 var(--ui);color:var(--text)}
.empty li.done::before{content:"✓";color:var(--ok)}
.empty li b{color:var(--text);font-weight:600}
.empty li .btn{margin-top:6px}

/* deck: horns, transport, groups */
#deck{grid-area:deck;display:flex;flex-direction:column;background:var(--deck);border-top:1px solid var(--line);min-height:0}
#horns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 10px 2px}
#horns:empty{display:none}
.horn{position:relative;isolation:isolate;height:50px;border-radius:11px;color:var(--ink);font:700 13px/1.15 var(--ui);padding:3px 12px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;-webkit-touch-callout:none;transition:transform .06s,filter .15s;
  background:radial-gradient(120% 100% at 50% 30%,color-mix(in srgb,var(--pad) 70%,#fff) 0%,var(--pad) 55%,color-mix(in srgb,var(--pad) 72%,#000) 100%);
  box-shadow:0 0 14px -4px color-mix(in srgb,var(--pad) 75%,transparent),inset 0 1px 0 #ffffff59,inset 0 -3px 0 #00000040,inset 0 0 0 1px #ffffff1f}
.horn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.horn small{position:absolute;left:5px;top:3px;font-size:9px;opacity:.6}
.horn:active{transform:scale(.94);filter:brightness(1.3)}
.horn.is-sounding{filter:brightness(1.4);box-shadow:0 0 0 2px #fff,0 0 24px 4px #fffa}
.horn.is-lifted{opacity:.3}
body.editing .horn,body.moving .horn{outline:2px dashed #ffffffb0;outline-offset:-5px}

#transport{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:13px 10px 8px}
.tp-bar{position:absolute;left:10px;right:10px;top:5px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.tp-bar i{display:block;height:100%;background:var(--text);transform-origin:left;transform:scaleX(0)}
.tp-clock{font:700 36px/1 var(--ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:74px}
.tp-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-ctl{display:flex;gap:6px}
#transport.idle .tp-clock,#transport.idle .tp-title{color:var(--dim)}

#tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 10px calc(env(safe-area-inset-bottom) + 10px);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:46px;padding:5px 14px;border-radius:12px;background:var(--raised);color:var(--muted);display:flex;flex-direction:column;justify-content:center;text-align:left}
.tab-name{font:700 15px/1.15 var(--ui);color:var(--text)}
.tab-n{font-size:11px;line-height:1.2;font-variant-numeric:tabular-nums}
.tab[aria-selected=true]{background:var(--text);color:#4a4e59}
.tab[aria-selected=true] .tab-name{color:var(--chassis)}

/* sheets */
#scrim{position:fixed;inset:0;z-index:50;background:#000000b3;display:none;align-items:flex-end;justify-content:center}
#scrim.open{display:flex}
#sheet{width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;background:var(--deck);border-radius:20px 20px 0 0;overflow:hidden;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.sh-head{display:flex;align-items:center;gap:2px;padding:10px 8px 4px 8px}
.sh-head h2{flex:1;margin:0 8px;font:700 21px/1.2 var(--ui)}
.sh-body{overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 22px)}
h3.sec{font:700 17px/1.25 var(--ui);margin:28px 0 2px}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 10px}
.field{margin-top:14px}
.field>label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.field>label b{color:var(--text);font-weight:600}
input[type=text],input[type=search],input[type=password],select{width:100%;height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--chassis);color:var(--text);font:inherit;user-select:text;-webkit-user-select:text}
input:focus,select:focus{outline:none;border-color:#fff}
input[type=range]{width:100%;height:34px;margin:0;accent-color:#fff}
.line{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px;border-bottom:1px solid var(--line)}
input.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;margin:0;transition:background .15s}
input.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
input.sw:checked{background:var(--ok)}
input.sw:checked::after{transform:translateX(18px)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.row>.btn{flex:1}
.navrow{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;border-bottom:1px solid var(--line);text-align:left}
.navrow b{font-weight:600}
.navrow span{margin-left:auto;color:var(--muted);font-size:13.5px;text-align:right}
.navrow svg{color:var(--dim)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:40px;height:40px;border-radius:11px;background:var(--pad);color:var(--ink);display:grid;place-items:center}
.swatch svg{display:none}
.swatch[aria-pressed=true]{outline:2px solid #fff;outline-offset:2px}
.swatch[aria-pressed=true] svg{display:block}
.clip{display:flex;align-items:center;gap:6px;margin-top:14px}
.clip b{font:700 21px/1 var(--ui);font-variant-numeric:tabular-nums;margin-right:auto}
.clip b small{display:block;font:400 12px/1.4 var(--ui);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--raised);border-radius:12px;padding:7px 8px 7px 10px;min-height:54px}
.li img{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--chassis);flex:none}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li input[type=text]{height:40px}
.li .btn,.gcard .btn{background:var(--chassis)}
.gcard{background:var(--raised);border-radius:12px;padding:8px 8px 10px 10px}
.gcard .top{display:flex;align-items:center;gap:2px}
.gcard .top input{flex:1;min-width:0;height:42px;margin-right:4px}
.gcard .hint{margin:8px 2px}
.gcard .row{margin-top:0}
.seg{display:flex;gap:4px;background:var(--chassis);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--text)}
code{display:block;background:var(--chassis);padding:10px 12px;border-radius:10px;margin:6px 0;word-break:break-all;user-select:all;-webkit-user-select:all;font-size:13px}
ol.steps{padding-left:22px;margin:8px 0;color:var(--muted)}
ol.steps li{margin:10px 0;padding-left:4px}
ol.steps b{color:var(--text);font-weight:600}
.foot{color:var(--dim);font-size:12.5px;margin-top:26px}

/* Launchpad map */
.lpmap{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:min(100%,250px);margin:14px auto 6px;padding:10px;border-radius:14px;background:#000}
.lpmap i{aspect-ratio:1;border-radius:4px;background:#2c2f37;font:700 9px/1 var(--ui);font-style:normal;color:#000;display:grid;place-items:center}
.lpmap .k{border-radius:50%}
.z-tile{background:#4C6FE6!important} .z-fx{background:#D93A40!important} .z-nav{background:#E9EBEF!important} .z-fade{background:#FF8B3E!important}
.z-stop{background:#FF5A5F!important} .z-again{background:#FFC53D!important} .z-rnd{background:#B17CFF!important} .z-rndg{background:#46D08A!important}
.lpmap .logo{background:none}
ul.legend{list-style:none;padding:0;margin:10px 0 0}
ul.legend li{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:baseline;padding:5px 0;font-size:13.5px;color:var(--muted)}
ul.legend b{color:var(--text);font-weight:600}
.chip{width:12px;height:12px;border-radius:3px;display:block;transform:translateY(1px)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);min-height:44px;transform:translateX(-50%);z-index:99;display:none;align-items:center;gap:6px;max-width:min(92vw,480px);
  background:var(--text);color:var(--chassis);border-radius:12px;padding:10px 14px;font-weight:600;box-shadow:0 10px 30px #000a}
#toast button{font-weight:700;text-decoration:underline;padding:8px;margin:-6px -6px -6px 2px;white-space:nowrap}

@media (min-width:560px){#status .msg{display:inline}}
/* tablets, laptops and phones on their side: the deck moves to the right */
@media (min-width:840px),(orientation:landscape) and (max-height:540px){
  body{grid-template:"head deck" auto "note deck" auto "main deck" minmax(0,1fr) / minmax(0,1fr) clamp(280px,32vw,360px)}
  #deck{border-top:0;border-left:1px solid var(--line);overflow-y:auto;padding-top:env(safe-area-inset-top)}
  #transport{order:-1;grid-template-columns:minmax(0,1fr);gap:6px;padding:20px 14px 10px}
  .tp-bar{left:14px;right:14px;top:10px}
  .tp-clock{font-size:56px}
  .tp-ctl{display:grid;grid-template-columns:48px 1fr 48px 48px;margin-top:6px}
  .tp-ctl .btn{width:auto;min-height:48px}
  #horns{padding:6px 14px 0;grid-template-columns:repeat(3,minmax(0,1fr))}
  #tabs{flex-direction:column;overflow:visible;padding:14px 14px 16px}
  .tab{flex-direction:row;align-items:center;justify-content:space-between;min-height:48px}
}
@media (min-width:840px){#scrim{align-items:center} #sheet{border-radius:20px;max-height:86dvh}}
@media (prefers-reduced-motion:reduce){.tile.is-live,#sheet{animation:none}}
</style>
</head>
<body class="size-m">
<header id="head">

<script>
'use strict';
/* ==========================================================================
   Matchljud — courtside sound desk
   Spotify (Web Playback SDK) + local sounds (Web Audio) + Launchpad Mini MK3
   ========================================================================== */
const VERSION = '2.10';

// Tile colours. Light pads carry dark ink, deep pads carry white ink, so every label passes contrast.
// lp = [bright, dim] index in the Launchpad's built-in palette.
const PADS = [
  { name: 'Röd',    bg: '#D93A40', ink: '#fff',    lp: [5, 7] },
  { name: 'Orange', bg: '#FF8B3E', ink: '#1F0E00', lp: [9, 11] },
  { name: 'Gul',    bg: '#FFC53D', ink: '#211A00', lp: [13, 15] },
  { name: 'Grön',   bg: '#46D08A', ink: '#04200F', lp: [21, 23] },
  { name: 'Turkos', bg: '#3CCBDA', ink: '#03222A', lp: [37, 39] },
  { name: 'Blå',    bg: '#4C6FE6', ink: '#fff',    lp: [45, 47] },
  { name: 'Lila',   bg: '#8A55DB', ink: '#fff',    lp: [49, 51] },
  { name: 'Rosa',   bg: '#D6377B', ink: '#fff',    lp: [57, 59] },
  { name: 'Grå',    bg: '#6C7180', ink: '#fff',    lp: [3, 1] },
];
const pad = t => PADS[t.color ?? 0] || PADS[0];
const TILE_PX = { s: 84, m: 108, l: 150 };
const SCOPES = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative user-library-read';
const SILENT_URI = 'spotify:track:3mkOlbSv5RYadx0JsjTrKq';
const QUICK = 0.5;   // seconds: how fast a playing song gives way to the next one

// iPhone and iPad: only the hardware buttons may change the sound level. A page cannot fade or lower
// Spotify there (its own Web Audio sounds are fine), so Spotify songs start and stop without fades.
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Mac/.test(navigator.platform || '') && navigator.maxTouchPoints > 1);
const VOLUME_LOCKED = IOS;
const noFade = t => VOLUME_LOCKED && !!t && t.kind === 'spotify';
let gesture = false;   // set by the first real tap or key press

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2) + Date.now());
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => { if (s == null || !isFinite(s)) return '–'; s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
const fmt1 = s => { if (s == null || !isFinite(s)) return '–'; s = Math.max(0, s); return Math.floor(s / 60) + ':' + (s % 60).toFixed(1).padStart(4, '0').replace('.', ','); };

const ICON = {
  chevron: '<path d="m10 6 6 6-6 6"/>', check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>', up: '<path d="m6 14 6-6 6 6"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>', play: '<path d="M8 5.5v13l10-6.5z"/>',
  trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
  next: '<path d="M4 12h11M11 7l5 5-5 5M20 6v12"/>',
  loop: '<path d="M17 3l3 3-3 3"/><path d="M4 11v-1a4 4 0 0 1 4-4h12"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v1a4 4 0 0 1-4 4H4"/>',
  sfx: '<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>',
  note: '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

function toast(msg, opt = {}) {
  if (typeof opt === 'number') opt = { ms: opt };
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (opt.action ? `<button>${esc(opt.action)}</button>` : '');
  el.style.display = 'flex';
  if (opt.action) $('button', el).onclick = () => { el.style.display = 'none'; opt.onAction(); };
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = 'none'; }, opt.ms || (opt.action ? 7000 : 3000));
}

/* ---------------- storage (IndexedDB) ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('matchljud', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('audio'); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
    });
  },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  put(store, k, v) { return this.tx(store, 'readwrite', s => s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
  keys(store) { return this.tx(store, 'readonly', s => s.getAllKeys()); },
  clear(store) { return this.tx(store, 'readwrite', s => s.clear()); },
};

/* ---------------- state ---------------- */
const defaultState = () => ({
  version: 2,
  settings: { fadeOut: 2, fadeIn: 0, musicVol: 100, sfxVol: 100, markPlayed: true, keepAwake: true, keepAlive: true, silentUri: SILENT_URI, lpIn: '', lpOut: '', tileSize: 'm', layout: 'free' },
  groups: [{ id: uid(), name: 'Match' }],
  tiles: [],
  binds: {},   // action id -> list of trigger keys (keypad keys, MIDI buttons)
  curGroup: null,
});
let S = defaultState();
let editMode = false;      // tap a tile to edit instead of play
let moving = null;         // id of a tile being moved
let searchQ = null;        // null = not searching
let lpPage = 0;            // Launchpad page within the current group
let sheetHook = null;      // lets an open sheet react to playback changes
let saveTimer = 0;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { DB.put('kv', 'state', S).catch(e => console.error(e)); Sync.schedule(); }, 250); }
const group = id => S.groups.find(g => g.id === id);
const curGroup = () => group(S.curGroup) || S.groups[0];
const tilesOf = gid => S.tiles.filter(t => t.groupId === gid).sort((a, b) => a.order - b.order);
const tile = id => S.tiles.find(t => t.id === id);
const isMusic = t => t.kind === 'spotify' || !t.overlay;
const playLen = t => Math.max(0, (t.stop || t.duration || 0) - (t.start || 0));
// a song continues with the next one in its list when the tile says so, or its whole group does
const playsOn = t => !!t.next || !!(group(t.groupId) || {}).autoNext;
const renumber = gid => tilesOf(gid).forEach((t, i) => { t.order = i; });
// The first eight sound effects live in the horn strip (and on the Launchpad's bottom row), whatever group is open.
function horns() { const out = []; for (const g of S.groups) for (const t of tilesOf(g.id)) if (!isMusic(t) && out.length < 8) out.push(t); return out; }
function gridTiles(gid) { const h = new Set(horns().map(t => t.id)); return tilesOf(gid).filter(t => !h.has(t.id)); }
const sheetOpen = () => $('#scrim').classList.contains('open');
const soundLocked = () => !(navigator.userActivation ? navigator.userActivation.hasBeenActive : gesture);

// Sound files: stored as bytes. Older versions stored Blobs, so both are read.
async function audioBytes(id) { const rec = await DB.get('audio', id); return !rec ? null : rec instanceof ArrayBuffer ? rec : await rec.arrayBuffer(); }
function bytesToB64(ab) { const b = new Uint8Array(ab); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }

/* ---------------- Spotify: login (PKCE) and the in-browser player ---------------- */
const SP = {
  get clientId() { return localStorage.getItem('sp_client') || ''; },
  set clientId(v) { localStorage.setItem('sp_client', v.trim()); },
  get redirect() { return location.origin + location.pathname.replace(/index\.html$/, ''); },
  token: localStorage.getItem('sp_at') || '', exp: +localStorage.getItem('sp_exp') || 0, refresh: localStorage.getItem('sp_rt') || '',
  player: null, deviceId: null, ready: false, sdkLoaded: false, activated: false,
  status: 'off',      // off | starting | ready | error
  sounding: false,    // a real track (not the silent keep-alive) may be audible
  lastVol: -1,
  get loggedIn() { return !!this.refresh; },

  async login() {
    if (!this.clientId) { toast('Fyll i Client ID först.'); return; }
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
    sessionStorage.setItem('sp_ver', verifier);
    location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ client_id: this.clientId, response_type: 'code', redirect_uri: this.redirect, code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES });
  },
  async handleRedirect() {
    const q = new URLSearchParams(location.search);
    if (q.get('error')) { history.replaceState(null, '', this.redirect); toast('Spotify-inloggningen avbröts.'); return; }
    const code = q.get('code'); if (!code) return;
    history.replaceState(null, '', this.redirect);
    await this.tokenReq(new URLSearchParams({ client_id: this.clientId, grant_type: 'authorization_code', code, redirect_uri: this.redirect, code_verifier: sessionStorage.getItem('sp_ver') || '' }));
    toast('Spotify är kopplat.');
  },
  async tokenReq(body) {
    const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.error || 'Spotify nekade inloggningen');
    this.token = j.access_token; this.exp = Date.now() + (j.expires_in - 60) * 1000;
    if (j.refresh_token) this.refresh = j.refresh_token;
    localStorage.setItem('sp_at', this.token); localStorage.setItem('sp_exp', this.exp); localStorage.setItem('sp_rt', this.refresh);
  },
  async getToken() {
    if (this.token && Date.now() < this.exp) return this.token;
    if (!this.refresh) throw new Error('Koppla Spotify i menyn först.');
    await this.tokenReq(new URLSearchParams({ client_id: this.clientId, grant_type: 'refresh_token', refresh_token: this.refresh }));
    return this.token;
  },
  logout() {
    ['sp_at', 'sp_exp', 'sp_rt'].forEach(k => localStorage.removeItem(k));
    this.token = this.refresh = ''; this.exp = 0;
    try { this.player && this.player.disconnect(); } catch (e) {}
    this.player = null; this.ready = false; this.sounding = false; this.status = 'off'; renderStatus();
  },

  async api(path, opt = {}) {
    const tok = await this.getToken();
    const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), 8000);   // never let a dead network freeze playback
    let r;
    try { r = await fetch('https://api.spotify.com/v1' + path, { ...opt, signal: ac.signal, headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', ...(opt.headers || {}) } }); }
    catch (e) { throw new Error('Spotify svarar inte. Kontrollera internet.'); }
    finally { clearTimeout(timer); }
    if (r.status === 204 || r.status === 202) return null;
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) { const err = new Error('Spotify: ' + ((j && j.error && (j.error.message || j.error.reason)) || r.status)); err.status = r.status; throw err; }
    return j;
  },

  initPlayer() {
    if (!this.loggedIn || this.player) return;
    this.status = 'starting'; renderStatus();
    const fail = msg => { this.status = 'error'; renderStatus(); if (msg) toast(msg, 5000); };
    const make = () => {
      const p = new Spotify.Player({ name: 'Matchljud', volume: 0.8, getOAuthToken: cb => this.getToken().then(cb).catch(e => toast(e.message)) });
      p.addListener('ready', ({ device_id }) => { this.deviceId = device_id; this.ready = true; this.status = 'ready'; renderStatus(); this.transfer(); });
      p.addListener('not_ready', () => { this.ready = false; this.status = 'starting'; renderStatus(); });
      p.addListener('initialization_error', ({ message }) => fail('Spotify-spelaren startade inte: ' + message));
      p.addListener('authentication_error', () => fail('Spotify-inloggningen gäller inte längre. Logga in igen i menyn.'));
      p.addListener('account_error', () => fail('Spotify Premium krävs för att spela här.'));
      p.addListener('playback_error', ({ message }) => console.warn('playback_error', message));
      p.addListener('autoplay_failed', () => toast('Tryck en gång på skärmen, sedan spelar låten.'));
      p.addListener('player_state_changed', st => Engine.onSpotifyState(st));
      p.connect().then(ok => { if (!ok) fail(); });
      this.player = p;
    };
    if (window.Spotify) return make();
    window.onSpotifyWebPlaybackSDKReady = make;
    if (!this.sdkLoaded) {
      this.sdkLoaded = true;
      const s = document.createElement('script'); s.src = 'https://sdk.scdn.co/spotify-player.js';
      s.onerror = () => { this.sdkLoaded = false; fail('Spotify kunde inte laddas. Kontrollera internet.'); };
      document.head.appendChild(s);
    }
  },
  async transfer() { try { await this.api('/me/player', { method: 'PUT', body: JSON.stringify({ device_ids: [this.deviceId], play: false }) }); } catch (e) { console.warn(e); } },
  // Must run inside a tap: browsers refuse to start sound otherwise.
  activate() {
    if (!this.player || this.activated) return;
    if (navigator.userActivation && !navigator.userActivation.isActive) return;
    try { this.player.activateElement(); this.activated = true; } catch (e) {}
  },
  setVol(v) {
    v = clamp(v, 0, 1); if (!this.player || Math.abs(v - this.lastVol) < 0.004) return;
    this.lastVol = v; try { Promise.resolve(this.player.setVolume(v)).catch(() => {}); } catch (e) {}
  },
  async play(uri, sec) {
    if (!this.ready) throw new Error(this.loggedIn ? 'Spotify startar fortfarande. Försök igen om en stund.' : 'Koppla Spotify i menyn för att spela den här låten.');
    const send = () => this.api('/me/player/play?device_id=' + encodeURIComponent(this.deviceId), { method: 'PUT', body: JSON.stringify({ uris: [uri], position_ms: Math.round((sec || 0) * 1000) }) });
    try { await send(); }
    catch (e) { if (e.status !== 404 && !(e.status >= 500)) throw e; await sleep(500); await send(); }   // the player device can go stale; one retry
  },
  pause() { return this.player ? Promise.race([Promise.resolve(this.player.pause()).catch(() => {}), sleep(1500)]) : Promise.resolve(); },
  seek(sec) { return this.player ? Promise.race([Promise.resolve(this.player.seek(Math.round(sec * 1000))).catch(() => {}), sleep(1500)]) : Promise.resolve(); },
};
function b64url(bytes) { let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

/* ---------------- local audio (Web Audio) ---------------- */
const AudioL = {
  ctx: null, master: null, music: null, buffers: new Map(), voices: new Set(),
  ensure() {
    if (!this.ctx) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iPhone: sound effects play even with the mute switch on
      this.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.connect(this.master);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  async buffer(soundId) {
    if (this.buffers.has(soundId)) return this.buffers.get(soundId);
    const bytes = await audioBytes(soundId); if (!bytes) throw new Error('Ljudfilen finns inte kvar på den här enheten.');
    const ctx = this.ensure();
    const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(bytes.slice(0), res, rej); if (p && p.catch) p.catch(rej); });   // both the old and the new calling style
    this.buffers.set(soundId, buf); return buf;
  },
  preload() { new Set(S.tiles.filter(t => t.kind === 'local').map(t => t.soundId)).forEach(id => this.buffer(id).catch(() => {})); },
  setMusic(v) { if (this.ctx) this.music.gain.setTargetAtTime(v, this.ctx.currentTime, 0.015); },
  // bus 'music' is driven by Mix; bus 'sfx' gets its own gain so effects can pile up on top
  async start(t, bus, vol, offset = 0) {
    const ctx = this.ensure(); const buf = await this.buffer(t.soundId);
    const src = ctx.createBufferSource(); src.buffer = buf;
    let out = this.music;
    if (bus === 'sfx') {
      out = ctx.createGain(); out.gain.value = vol; out.connect(this.master);
      this.voices.add(src); src.addEventListener('ended', () => this.voices.delete(src));
    }
    src.connect(out);
    offset = clamp(offset, 0, Math.max(0, buf.duration - 0.01));
    if (bus === 'sfx' && t.stop && t.stop > offset) src.start(0, offset, t.stop - offset); else src.start(0, offset);
    return { src, startedAt: ctx.currentTime - offset };
  },
  killSfx() { this.voices.forEach(s => { try { s.stop(); } catch (e) {} }); this.voices.clear(); },
};

/* ---------------- Mix: one fader for the music channel (Spotify and local music share it) ---------------- */
const Mix = {
  level: 1,   // fade envelope 0..1
  base: 1,    // tile volume × music volume
  duck: 1,    // 0 during a dropout
  job: null,
  apply() { const v = this.level * this.level * this.base * this.duck; SP.setVol(v); AudioL.setMusic(v); },   // squared: fades sound even to the ear
  set(v) { if (this.job) this.job.stop(); this.level = v; this.apply(); },
  ramp(to, sec) {
    if (this.job) this.job.stop();
    if (!(sec > 0.04) || this.level === to) { this.level = to; this.apply(); return Promise.resolve(); }
    return new Promise(done => {
      const j = this.job = { from: this.level, to, t0: performance.now(), ms: sec * 1000,
        stop: () => { clearInterval(j.iv); if (this.job === j) this.job = null; done(); } };
      j.iv = setInterval(() => {
        const k = Math.min(1, (performance.now() - j.t0) / j.ms);
        this.level = j.from + (j.to - j.from) * k; this.apply();
        if (k >= 1) j.stop();
      }, 40);
    });
  },
  // A fade-out already running must not hold up the next song: shorten what is left of it.
  hurry(sec) {
    const j = this.job; if (!j || j.to !== 0) return;
    if (j.ms - (performance.now() - j.t0) > sec * 1000) { j.from = this.level; j.t0 = performance.now(); j.ms = Math.max(1, sec * 1000); }
  },
};

/* ---------------- playback engine ----------------
   Every request (play, fade, stop) is queued and runs one at a time, so two songs can never
   fight over the player. `gen` marks the latest request; older ones give up when they notice. */
const Engine = {
  cur: null,           // { tile, kind, phase: loading|playing|fading|ending, ... }
  sfx: new Map(),      // tile id -> number of voices sounding
  gen: 0, pending: 0, chain: Promise.resolve(), liveLocal: null,

  run(fn) {
    this.pending++;
    const p = this.chain.then(fn).catch(e => console.warn(e)).finally(() => { this.pending--; });
    this.chain = p; return p;
  },
  vol(t) { return (t.volume >= 0 ? t.volume : 100) / 100 * (S.settings.musicVol / 100); },
  sfxVol(t) { return (t.volume >= 0 ? t.volume : 100) / 100 * (S.settings.sfxVol / 100); },
  fadeOutSec(t) { return noFade(t) ? 0 : t && t.fadeOut >= 0 ? t.fadeOut : S.settings.fadeOut; },
  fadeInSec(t) { return noFade(t) ? 0 : t && t.fadeIn >= 0 ? t.fadeIn : S.settings.fadeIn; },
  endOf(c) { return c.tile.stop || c.dur || c.tile.duration || 0; },
  position() {
    const c = this.cur; if (!c) return 0;
    if (c.phase === 'loading') return c.pos0;
    if (c.kind === 'local') return c.local ? AudioL.ctx.currentTime - c.local.startedAt : c.pos0;
    return c.paused ? c.pos0 : c.pos0 + (performance.now() - c.t0) / 1000;
  },
  nextAfter(t) { const list = tilesOf(t.groupId).filter(isMusic); return list[list.findIndex(x => x.id === t.id) + 1] || null; },

  // A tap on a tile, a pad or a bound key.
  trigger(t) {
    if (!t) return;
    SP.activate(); AudioL.ensure();
    if (!isMusic(t)) return this.playSfx(t);
    const c = this.cur;
    if (c && c.tile.id === t.id) {
      if (c.phase === 'loading' || performance.now() - c.born < 400) return;   // a nervous double tap must not stop the song it just started
      return this.fadeOut();
    }
    this.play(t);
  },

  async playSfx(t) {
    if (soundLocked()) return toast('Tryck en gång på skärmen först. Webbläsaren spelar inget ljud innan dess.', 5000);
    try {
      const v = await AudioL.start(t, 'sfx', this.sfxVol(t), t.start || 0);
      this.sfx.set(t.id, (this.sfx.get(t.id) || 0) + 1); UI.refresh();
      v.src.addEventListener('ended', () => { const n = (this.sfx.get(t.id) || 1) - 1; if (n > 0) this.sfx.set(t.id, n); else this.sfx.delete(t.id); UI.refresh(); });
    } catch (e) { toast(e.message); }
  },

  play(t, o = {}) {
    const gen = ++this.gen;
    const start = o.from != null ? o.from : (t.start || 0);
    const c = this.cur = { tile: t, kind: t.kind, phase: 'loading', born: performance.now(), segStart: t.start || 0, pos0: start, t0: 0, heardAt: 0, loopsLeft: t.loop || 0, paused: false, local: null };
    if (S.settings.markPlayed && !o.preview && !t.played) { t.played = true; save(); }
    Idle.on = false;
    Mix.hurry(o.cut ? 0 : QUICK);
    UI.refresh();   // the tile lights up at once, before Spotify has answered
    return this.run(async () => {
      if (gen !== this.gen) return;
      await this.silence(o.cut ? 0 : QUICK);
      if (gen !== this.gen) return;
      const fadeIn = this.fadeInSec(t);
      Mix.base = this.vol(t); Mix.duck = 1; Mix.set(fadeIn > 0 ? 0 : 1);
      try {
        if (t.kind === 'spotify') {
          SP.sounding = true;
          await SP.play(t.uri, start);
        } else {
          if (soundLocked()) throw new Error('Tryck en gång på skärmen först. Webbläsaren spelar inget ljud innan dess.');
          const v = await AudioL.start(t, 'music', 1, start);
          if (gen !== this.gen) { try { v.src.stop(); } catch (e) {} return; }
          this.watchLocal(c, v);
        }
      } catch (e) {
        if (t.kind === 'spotify') { SP.sounding = false; await SP.pause(); }
        if (this.cur === c) { this.cur = null; UI.refresh(); }
        toast(e.message, 4500); return;
      }
      if (gen !== this.gen) return;   // a newer request took over while this one was starting
      c.phase = 'playing'; c.pos0 = start; c.t0 = c.heardAt = performance.now();
      if (fadeIn > 0) Mix.ramp(1, fadeIn);
      UI.refresh();
    });
  },
  watchLocal(c, v) {
    this.liveLocal = c.local = v;
    v.src.onended = () => {
      if (this.cur !== c || c.local !== v || c.phase !== 'playing') return;
      if (c.loopsLeft) return this.loop(c);
      this.liveLocal = null; this.advance(c);
    };
  },

  // Make the music channel quiet: fade whatever is audible, then stop it.
  async silence(sec) {
    if (VOLUME_LOCKED && !this.liveLocal) sec = 0;   // nothing here can be faded: stop at once rather than wait in vain
    if ((this.liveLocal || SP.sounding) && Mix.level > 0) await Mix.ramp(0, sec);
    const v = this.liveLocal;
    if (v) { this.liveLocal = null; v.src.onended = null; try { v.src.stop(); } catch (e) {} }
    if (SP.sounding) { SP.sounding = false; await SP.pause(); }
  },

  fadeOut() {
    const c = this.cur; if (!c) return;
    if (c.phase === 'fading' || c.phase === 'ending') return Mix.hurry(0);   // second press: stop now
    const sec = c.phase === 'loading' ? 0 : this.fadeOutSec(c.tile);
    ++this.gen; c.phase = 'fading'; UI.refresh();
    this.run(async () => { await this.silence(sec); if (this.cur === c) { this.cur = null; UI.refresh(); } });
  },
  stopAll() {
    ++this.gen; this.cur = null; Mix.hurry(0);
    AudioL.killSfx(); this.sfx.clear(); UI.refresh();
    this.run(() => this.silence(0));
  },
  restart() { if (this.cur) this.play(this.cur.tile, { cut: true }); },

  // The song reached its stop point or its natural end.
  finish(c, sec) {
    if (c.phase !== 'playing') return;
    c.phase = 'ending'; UI.refresh();
    this.run(async () => { if (this.cur !== c) return; await this.silence(sec); this.advance(c); });
  },
  advance(c) {
    if (this.cur !== c) return;
    this.cur = null; UI.refresh();
    const nx = playsOn(c.tile) && this.nextAfter(c.tile);
    if (nx) this.play(nx);
  },
  async loop(c) {
    if (c.looping) return; c.looping = true;
    if (c.loopsLeft > 0) c.loopsLeft--;
    try {
      if (c.kind === 'spotify') {
        await SP.seek(c.segStart);
        if (this.cur === c) { c.pos0 = c.segStart; c.t0 = c.heardAt = performance.now(); }
      } else {
        const old = c.local; old.src.onended = null; try { old.src.stop(); } catch (e) {}
        const v = await AudioL.start(c.tile, 'music', 1, c.segStart);
        if (this.cur !== c || c.phase !== 'playing') { try { v.src.stop(); } catch (e) {} return; }
        this.watchLocal(c, v);
      }
    } finally { c.looping = false; UI.refresh(); }
  },

  // Spotify reports what the player is really doing; keep our clock honest.
  onSpotifyState(st) {
    Idle.onState(st);
    const c = this.cur; if (!c || c.kind !== 'spotify' || c.phase === 'loading' || !st) return;
    const tr = st.track_window && st.track_window.current_track;
    if (!tr || (tr.uri !== c.tile.uri && !(tr.linked_from && tr.linked_from.uri === c.tile.uri))) return;
    const pos = st.position / 1000;
    if (performance.now() - c.heardAt < 1500 && Math.abs(pos - this.position()) > 3) return;   // a late report from before the (re)start
    c.dur = st.duration / 1000;
    if (st.paused) {
      if (c.phase === 'playing' && c.rolling && pos < 0.5 && this.position() > 5) { SP.sounding = false; return this.advance(c); }   // the track ran out
      c.paused = true; c.pos0 = pos;
    } else { c.rolling = true; c.paused = false; c.pos0 = pos; c.t0 = performance.now(); }
  },

  inDrop(t, pos) { return (t.drops || []).some(d => pos >= d.at && pos < d.at + d.len); },
  tick() {
    const c = this.cur;
    if (c && c.phase === 'playing' && !c.paused) {
      const t = c.tile, pos = this.position(), end = this.endOf(c);
      const duck = !noFade(t) && this.inDrop(t, pos) ? 0 : 1;
      if (duck !== Mix.duck) { Mix.duck = duck; Mix.apply(); }
      if (end > 0) {
        if (c.loopsLeft) { if (pos >= end - (c.kind === 'spotify' && !t.stop ? 0.35 : 0.03)) this.loop(c); }
        else if (t.stop) { if (pos >= t.stop - this.fadeOutSec(t)) this.finish(c, Math.max(0.05, t.stop - pos)); }
        else if (c.kind === 'spotify' && pos > 1 && pos >= end - 0.3) this.finish(c, 0.2);
      }
    }
    UI.clock();
  },

  // A random song nobody has heard yet from one group. Starts over when the group runs dry.
  random(gid) {
    const g = group(gid); if (!g) return;
    SP.activate(); AudioL.ensure();
    const pool = tilesOf(gid).filter(isMusic);
    if (!pool.length) return toast(`Det finns inga låtar i ${g.name}.`);
    const notCur = t => !this.cur || this.cur.tile.id !== t.id;
    let cand = pool.filter(t => !t.played && notCur(t));
    if (!cand.length) {
      pool.forEach(t => { t.played = false; }); save();
      toast(`Alla låtar i ${g.name} är spelade. Börjar om.`);
      cand = pool.filter(notCur); if (!cand.length) cand = pool;
    }
    this.play(cand[Math.floor(Math.random() * cand.length)]);
  },
};

/* ---------------- silent keep-alive ----------------
   While nothing plays, a silent Spotify track loops so the speaker and the player stay awake
   and the next song starts without a clipped first second. */
const Idle = {
  on: false, starting: false, since: 0, quietSince: 0, fails: 0, retryAt: 0,
  tick() {
    const now = performance.now();
    if (this.starting) return;
    if (Engine.cur || Engine.pending) { this.on = false; this.quietSince = 0; return; }
    if (!S.settings.keepAlive || !SP.ready || !SP.activated) return;
    if (!this.quietSince) this.quietSince = now;
    if (now < this.retryAt) return;
    if ((!this.on && now - this.quietSince > 1500) || (this.on && now - this.since > 9 * 60 * 1000)) this.start();
  },
  start() {
    this.starting = true;
    Engine.run(async () => {
      try {
        if (Engine.cur) return;
        await SP.play(S.settings.silentUri || SILENT_URI, 0);
        this.on = true; this.since = performance.now(); this.fails = 0;
      } catch (e) { this.on = false; this.fails++; this.retryAt = performance.now() + Math.min(300000, 15000 * 2 ** this.fails); }
      finally { this.starting = false; }
    });
  },
  onState(st) {   // something else paused the silent track: try again shortly
    if (this.on && !Engine.cur && st && st.paused && performance.now() - this.since > 4000) { this.on = false; this.quietSince = performance.now(); this.retryAt = performance.now() + 3000; }
  },
};
setInterval(() => { Engine.tick(); Idle.tick(); }, 100);

/* ---------------- functions a button can run ---------------- */
function stepGroup(d) { const g = S.groups[S.groups.indexOf(curGroup()) + d]; if (g) selectGroup(g.id); }
function nudgeVol(d) {
  S.settings.musicVol = clamp(S.settings.musicVol + d, 0, 100); save();
  if (Engine.cur) { Mix.base = Engine.vol(Engine.cur.tile); Mix.apply(); }
  toast('Musikvolym ' + S.settings.musicVol + ' %' + (VOLUME_LOCKED ? '. Påverkar bara ljudfiler här.' : '.'), 1200);
}
const ACTIONS = [
  { id: 'fade', name: 'Tona ut', lp: 9, run: () => Engine.fadeOut() },
  { id: 'stop', name: 'Stoppa allt', lp: 5, run: () => Engine.stopAll() },
  { id: 'restart', name: 'Börja om låten', lp: 13, run: () => Engine.restart() },
  { id: 'random', name: 'Slumpa i gruppen som visas', lp: 53, run: () => Engine.random(curGroup().id) },
  { id: 'next', name: 'Nästa grupp', lp: 45, run: () => stepGroup(1) },
  { id: 'prev', name: 'Föregående grupp', lp: 45, run: () => stepGroup(-1) },
  { id: 'louder', name: 'Musiken högre', hint: 'Passar bra på en ratt', lp: 3, run: () => nudgeVol(5) },
  { id: 'softer', name: 'Musiken lägre', hint: 'Passar bra på en ratt', lp: 3, run: () => nudgeVol(-5) },
];
const action = id => ACTIONS.find(a => a.id === id);

/* ---------------- triggers: any key, keypad button or MIDI button can run a tile, a group's random song or a function ----------------
   key format: 'm|<port name>|n<channel>|<note>', 'm|<port name>|c<channel>|<cc>',
   or 'k|<KeyboardEvent.code>' with '|Ctrl,Alt,Shift,Meta' added when modifiers were held (keypads often send shortcuts) */
const MOD_LONG = { Ctrl: 'Ctrl', Alt: 'Alt', Shift: 'Shift', Meta: 'Cmd' };
const MOD_SHORT = { Ctrl: 'Ctrl', Alt: 'Alt', Shift: '⇧', Meta: '⌘' };
const KEY_NAMES = { Space: 'Mellanslag', Enter: 'Enter', NumpadEnter: 'Num Enter', Backspace: '⌫', Tab: 'Tab', Delete: 'Delete', Insert: 'Insert', Home: 'Home', End: 'End', PageUp: 'Page Up', PageDown: 'Page Down',
  ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', AudioVolumeUp: 'Volym +', AudioVolumeDown: 'Volym −', AudioVolumeMute: 'Ljud av',
  MediaPlayPause: 'Spela/paus', MediaTrackNext: 'Nästa spår', MediaTrackPrevious: 'Föregående spår', Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']',
  Semicolon: ';', Quote: "'", Backquote: '`', Backslash: '\\', IntlBackslash: '<', Comma: ',', Period: '.', Slash: '/' };
const Trig = {
  learn: null,   // { tile } | { group } | { action }, plus done() and quiet
  last: '',
  midiKey(port, d) {
    const type = d[0] & 0xF0; if (!((type === 0x90 || type === 0xB0) && d[2] > 0)) return null;
    return 'm|' + (port.name || port.id) + '|' + (type === 0x90 ? 'n' : 'c') + (d[0] & 0x0F) + '|' + d[1];
  },
  keyOf(e) {   // a keydown as a trigger key; null for a lone modifier
    const code = e.code || (e.key && e.key !== 'Unidentified' ? 'K:' + encodeURIComponent(e.key) : '');
    if (!code || /^(Shift|Control|Alt|Meta|OS|CapsLock|Fn|NumLock)/.test(code) || /^(Shift|Control|Alt|Meta|AltGraph|Fn|OS)$/.test(e.key)) return null;
    const mods = ['Ctrl', 'Alt', 'Shift', 'Meta'].filter((m, i) => [e.ctrlKey, e.altKey, e.shiftKey, e.metaKey][i]);
    return 'k|' + code + (mods.length ? '|' + mods.join(',') : '');
  },
  find(key) {
    const t = S.tiles.find(x => (x.trig || []).includes(key)); if (t) return { tile: t };
    const g = S.groups.find(x => (x.trig || []).includes(key)); if (g) return { group: g };
    const a = ACTIONS.find(x => (S.binds[x.id] || []).includes(key)); return a ? { action: a } : null;
  },
  unbind(key) {
    [...S.tiles, ...S.groups].forEach(x => { if (x.trig) x.trig = x.trig.filter(k => k !== key); });
    for (const id in S.binds) S.binds[id] = S.binds[id].filter(k => k !== key);
  },
  keysOf(l) { return l.action ? (S.binds[l.action] = S.binds[l.action] || []) : ((l.tile || l.group).trig = (l.tile || l.group).trig || []); },
  handle(key) {
    if (!key) return false;
    this.seen(key);
    if (this.learn) {
      const l = this.learn; this.learn = null;
      this.unbind(key); this.keysOf(l).push(key);
      save(); UI.build();
      if (!l.quiet) toast('Kopplad till ' + this.label(key) + '.');
      if (l.done) l.done(key);
      return true;
    }
    const hit = this.find(key); if (!hit) return false;
    if (hit.action) hit.action.run();
    else if (hit.group) Engine.random(hit.group.id);
    else if (Brush.on) Brush.one(hit.tile);
    else if (editMode) openTileEditor(hit.tile);
    else Engine.trigger(hit.tile);
    return true;
  },
  // "Last pressed" line on the keypad page: shows what a button sends and what it does
  seen(key) {
    this.last = key; const el = $('#kLast'); if (!el) return;
    const hit = this.find(key);
    const what = !hit ? (key === 'k|Space' ? 'tonar ut' : 'ingen funktion än') : hit.action ? hit.action.name.toLowerCase() : hit.group ? 'slumpar ur ' + hit.group.name : 'spelar ' + hit.tile.title;
    el.textContent = this.label(key).replace(/^./, m => m.toUpperCase()) + ': ' + what;
  },
  parts(key) {
    const p = key.split('|');
    return { kb: p[0] === 'k', code: p[1], mods: p[0] === 'k' && p[2] ? p[2].split(',') : [], port: p[1], cc: p[0] === 'm' && p[2][0] === 'c', num: +p[3] };
  },
  label(key) {
    const p = this.parts(key);
    if (p.kb) return 'tangent ' + [...p.mods.map(m => MOD_LONG[m] || m), this.keyName(p.code)].join(' + ');
    if (/launchpad|lpmini/i.test(p.port)) {
      if (!p.cc) return 'pad ' + (9 - Math.floor(p.num / 10)) + '·' + (p.num % 10);
      if (p.num >= 91 && p.num <= 98) return 'knapp ' + ['▲', '▼', '◀', '▶', 'Session', 'Drums', 'Keys', 'User'][p.num - 91];
      if (p.num % 10 === 9) return 'sidoknapp ' + (9 - Math.floor(p.num / 10));
    }
    return (p.cc ? 'knapp ' : 'not ') + p.num + ' på ' + p.port;
  },
  keyName(code) {
    if (code.startsWith('K:')) return decodeURIComponent(code.slice(2));
    return KEY_NAMES[code] || code.replace(/^Key|^Digit/, '').replace(/^Numpad/, 'Num ');
  },
  // short form for the corner of a tile
  short(key) {
    const p = this.parts(key); let s;
    if (p.kb) s = [...p.mods.map(m => MOD_SHORT[m] || m), this.keyName(p.code)].join(p.mods.length ? '+' : '');
    else if (!/launchpad|lpmini/i.test(p.port)) s = (p.cc ? 'cc ' : 'not ') + p.num;
    else if (!p.cc) s = (9 - Math.floor(p.num / 10)) + '·' + (p.num % 10);
    else if (p.num >= 91 && p.num <= 98) s = ['▲', '▼', '◀', '▶', 'Session', 'Drums', 'Keys', 'User'][p.num - 91];
    else s = 'sida ' + (9 - Math.floor(p.num / 10));
    return `<kbd>${esc(s)}</kbd>`;   // the keycap outline tells a hand-picked button from a plain grid position
  },
  count() { return S.tiles.concat(S.groups).reduce((n, x) => n + (x.trig || []).length, 0) + Object.values(S.binds).reduce((n, l) => n + l.length, 0); },
};

/* ---------------- Launchpad Mini MK3 (Web MIDI, Programmer mode) ----------------
   LED index = row*10 + column, counted from the bottom left. Rows 8..2 show the open group (56 per page),
   row 1 the horns. Top row 91..98 and right column 89..19 are control buttons. */
const LP = {
  access: null, input: null, output: null, connected: false, last: {}, timer: 0,
  SCENE: [89, 79, 69, 59, 49, 39, 29],
  async connect(interactive) {
    if (!navigator.requestMIDIAccess) { if (interactive) toast('Den här webbläsaren kan inte prata med Launchpad. Använd Chrome.'); return; }
    try { this.access = await navigator.requestMIDIAccess({ sysex: true }); }
    catch (e) {
      try { this.access = await navigator.requestMIDIAccess(); }
      catch (e2) { if (interactive) toast('Chrome fick inte använda MIDI. Tillåt MIDI för sidan och försök igen.', 5000); return; }
    }
    this.access.onstatechange = () => { clearTimeout(this.repick); this.repick = setTimeout(() => this.pick(), 300); };
    this.pick(interactive);
  },
  ports() { const ins = [], outs = []; if (this.access) { this.access.inputs.forEach(p => ins.push(p)); this.access.outputs.forEach(p => outs.push(p)); } return { ins, outs }; },
  isLp: p => /launchpad|lpmini/i.test(p.name || ''),
  choose(list, saved) {
    if (saved) { const p = list.find(x => x.id === saved || x.name === saved); if (p) return p; }
    const lp = list.filter(this.isLp);   // the Launchpad shows two ports; Programmer mode talks on the "MIDI" one, not "DAW"
    return lp.find(p => /midi/i.test(p.name) && !/daw/i.test(p.name)) || lp.find(p => !/daw/i.test(p.name)) || lp[lp.length - 1] || null;
  },
  pick(interactive) {
    const { ins, outs } = this.ports();
    const was = this.connected;
    this.input = this.choose(ins, S.settings.lpIn); this.output = this.choose(outs, S.settings.lpOut);
    this.connected = !!(this.input && this.output);
    ins.forEach(p => { p.onmidimessage = e => {
      if (this.isLp(p) && p !== this.input) return;   // ignore the Launchpad's second port so nothing fires twice
      const key = Trig.midiKey(p, e.data);
      if (key && soundLocked()) toast('Tryck en gång på skärmen först. Webbläsaren spelar inget ljud innan dess.', 5000);
      if (Trig.handle(key)) return;
      if (p === this.input) this.onMsg(e.data);
    }; });
    if (this.connected) { this.programmerMode(); this.render(); }
    else if (interactive) toast(ins.length ? 'Hittade MIDI men ingen Launchpad. Välj port i menyn.' : 'Ingen Launchpad hittades. Kontrollera kabeln.', 4500);
    if (was !== this.connected) UI.build();
    renderStatus();
  },
  send(bytes) { try { if (this.output) this.output.send(bytes); } catch (e) { console.warn(e); } },
  programmerMode() { this.last = {}; this.send([0xF0, 0x00, 0x20, 0x29, 0x02, 0x0D, 0x0E, 0x01, 0xF7]); },

    this.at(e.clientX, e.clientY); this.scroll();
  },
  at(x, y) {
    const el = document.elementFromPoint(x, y); const hit = el && el.closest('#grid .tile[data-t], #horns .horn'); if (!hit) return;
    const t = tile(hit.dataset.t); if (!t || !this.apply(t)) return;
    this.stroke.n++; const p = pad(t); hit.style.setProperty('--pad', p.bg); hit.style.setProperty('--ink', p.ink);

  },
  scroll() {   // drag to the top or bottom edge to keep painting further down

    requestAnimationFrame(() => this.scroll());
  },
  end() {
    const s = this.stroke; if (!s) return; this.stroke = null;
    if (!s.n) return;
    save(); UI.build();
    toast(s.n === 1 ? '1 ruta målad.' : s.n + ' rutor målade.', { action: 'Ångra', onAction: () => { S.tiles.forEach(t => { const o = s.snap.get(t.id); if (o) { t.color = o.color; t.next = o.next; } }); save(); UI.build(); } });
  },
  one(t) { if (this.apply(t)) { save(); UI.build(); } },   // a Launchpad pad or bound key while painting
};
document.addEventListener('pointermove', e => { const s = Brush.stroke; if (s && e.pointerId === s.pid) { s.y = e.clientY; Brush.at(e.clientX, e.clientY); } }, { passive: true });

/* ---------------- interactions ---------------- */
// Holding a tile for half a second opens its settings; a short tap plays it.
const hold = {
  timer: 0, fired: false, x: 0, y: 0,
  start(e, id) {
    this.fired = false; this.x = e.clientX; this.y = e.clientY; clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.fired = true; if (navigator.vibrate) navigator.vibrate(12); openTileEditor(tile(id)); }, 500);
  },
  move(e) { if (Math.hypot(e.clientX - this.x, e.clientY - this.y) > 10) this.cancel(); },
  cancel() { clearTimeout(this.timer); },
};
for (const root of [$('#grid'), $('#horns')]) {
  root.addEventListener('pointermove', e => hold.move(e));
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) root.addEventListener(ev, () => hold.cancel());
  root.addEventListener('contextmenu', e => e.preventDefault());
}
$('#main').addEventListener('scroll', () => hold.cancel(), { passive: true });
$('#grid').addEventListener('pointerdown', e => { hold.fired = false; const el = e.target.closest('.tile[data-t]'); if (!el) return; if (Brush.on) return Brush.start(e); if (editMode) Drag.down(e, el); else if (!moving) hold.start(e, el.dataset.t); });
$('#grid').addEventListener('click', e => {
  if (hold.fired) { hold.fired = false; return; }
  if (Brush.on && !e.target.closest('.vlp-btn')) return;
  if (Drag.swallow) return;
  const vb = e.target.closest('.vlp-btn'); if (vb) { SP.activate(); AudioL.ensure(); LP.onMsg([0xB0, +vb.dataset.cc, 127]); return; }
  const act = e.target.closest('[data-act]');
  if (act) return act.dataset.act === 'add' ? openAdd() : openMenu(act.dataset.act);
  const el = e.target.closest('.tile'); if (!el) return;
  if (moving) return placeTile(el.dataset.end ? null : tile(el.dataset.t));
  const t = tile(el.dataset.t); if (!t) return;
  if (editMode) openTileEditor(t); else Engine.trigger(t);
});
// Horns fire the moment the finger lands, like a real pad.
let hornDown = false;
function hornTap(t) { if (moving) placeTile(t); else if (editMode) openTileEditor(t); else Engine.trigger(t); }

});

/* ---------- add songs and sounds ---------- */
let addTab = 'search', lastTracks = [];
function openAdd() {
  sheetHook = null;
  openSheet('Lägg till i ' + curGroup().name, `<div class="seg">${[['search', 'Sök Spotify'], ['pl', 'Spellistor'], ['local', 'Ljudfil']].map(([k, n]) => `<button data-tab="${k}">${n}</button>`).join('')}</div><div id="aBody"></div>`);
  $$('#shBody [data-tab]').forEach(b => { b.onclick = () => { addTab = b.dataset.tab; drawAdd(); }; });

}
function addSpotifyTrack(tr, gid) {
  if (!tr || !/^spotify:track:/.test(tr.uri || '')) return false;
  S.tiles.push({ id: uid(), groupId: gid, order: tilesOf(gid).length, kind: 'spotify', uri: tr.uri, title: tr.name, alt: '', artist: (tr.artists || []).map(a => a.name).join(', '), duration: (tr.duration_ms || 0) / 1000, start: 0, stop: null, color: 0, volume: -1, fadeIn: -1, fadeOut: -1, next: false, overlay: false, played: false });
  return true;
}
const hasTrack = uri => S.tiles.some(t => t.uri === uri && t.groupId === curGroup().id);
function trackRow(tr) {
  const img = tr.album && tr.album.images && tr.album.images.length ? tr.album.images[tr.album.images.length - 1].url : '';
  const has = hasTrack(tr.uri);
  return `<div class="li">${img ? `<img src="${esc(img)}" alt="">` : ''}<div class="m"><b>${esc(tr.name)}</b><small>${esc((tr.artists || []).map(a => a.name).join(', '))}, ${fmt(tr.duration_ms / 1000)}</small></div><button class="iconbtn" data-add="${esc(tr.uri)}" aria-label="Lägg till ${esc(tr.name)}" ${has ? 'disabled' : ''}>${ic(has ? 'check' : 'plus')}</button></div>`;
}
function bindAddButtons() {
  $$('#shBody [data-add]').forEach(b => { b.onclick = () => {
    if (!addSpotifyTrack(lastTracks.find(x => x.uri === b.dataset.add), curGroup().id)) return;
    b.innerHTML = ic('check'); b.disabled = true; save(); UI.build();
  }; });
}
async function drawAdd() {
  $$('#shBody [data-tab]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === addTab)));
  const body = $('#aBody');
  if (addTab !== 'local' && !SP.loggedIn) {
    body.innerHTML = '<p class="hint" style="margin-top:14px">Koppla Spotify för att söka och hämta spellistor.</p><button class="btn primary" id="aLogin">Koppla Spotify</button>';
    $('#aLogin').onclick = () => openMenu('spotify'); return;
  }
  if (addTab === 'search') {
    body.innerHTML = '<div class="row"><input type="search" id="aQ" placeholder="Låt eller artist" enterkeyhint="search" autocomplete="off"><button class="btn primary" id="aGo" style="flex:none">Sök</button></div><div class="list" id="aRes"></div><div id="aMore"></div>';
    let offset = 0;
    const run = async more => {
      const q = $('#aQ').value.trim(); if (!q) return;
      if (!more) { offset = 0; lastTracks = []; $('#aRes').innerHTML = '<p class="hint">Söker…</p>'; }
      try {
        const j = await SP.api('/search?type=track&limit=10&offset=' + offset + '&q=' + encodeURIComponent(q));
        const items = (j && j.tracks && j.tracks.items) || []; lastTracks = lastTracks.concat(items); offset += items.length;
        if (!$('#aRes')) return;

async function showPlaylist(id, name) {
  const body = $('#aBody'); body.innerHTML = '<p class="hint" style="margin-top:14px">Hämtar låtar…</p>';
  try {
    let tracks = [], url = id === '__liked' ? '/me/tracks?limit=50' : '/playlists/' + id + '/items?limit=50';
    while (url && tracks.length < 1000) {
      const j = await SP.api(url);
      ((j && j.items) || []).forEach(it => { const tr = it.item || it.track; if (tr && /^spotify:track:/.test(tr.uri || '')) tracks.push(tr); });
      url = j && j.next ? j.next.replace('https://api.spotify.com/v1', '') : null;
    }
    if (!$('#aBody')) return;
    lastTracks = tracks;
    body.innerHTML = `<div class="row"><button class="btn small" id="aBack" style="flex:none">Tillbaka</button><b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</b><button class="btn small primary" id="aAll" style="flex:none">Lägg till alla ${tracks.length}</button></div><div class="list">${tracks.map(trackRow).join('')}</div>`;
    $('#aBack').onclick = drawAdd;
    $('#aAll').onclick = () => { let n = 0; tracks.forEach(tr => { if (!hasTrack(tr.uri) && addSpotifyTrack(tr, curGroup().id)) n++; }); save(); UI.build(); toast(n + ' låtar lades till i ' + curGroup().name + '.'); showPlaylist(id, name); };
    bindAddButtons();
  } catch (e) {
    body.innerHTML = `<p class="hint" style="margin-top:14px">${esc(e.message)}. Spotify låter bara appar läsa spellistor som du själv äger eller samarbetar i.</p><button class="btn" id="aBack">Tillbaka</button>`;
    $('#aBack').onclick = drawAdd;
  }
}
$('#fileAudio').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  const over = !!$('#fileAudio').dataset.over, gid = curGroup().id; let n = 0;
  for (const f of files) {
    const soundId = uid();
    try {
      await DB.put('audio', soundId, await f.arrayBuffer());
      const buf = await AudioL.buffer(soundId);
      S.tiles.push({ id: uid(), groupId: gid, order: tilesOf(gid).length, kind: 'local', soundId, title: f.name.replace(/\.[^.]+$/, ''), alt: '', artist: '', duration: buf.duration, start: 0, stop: null, color: over ? 5 : 0, volume: -1, fadeIn: -1, fadeOut: -1, next: false, overlay: over, played: false });
      n++;
    } catch (err) { DB.del('audio', soundId).catch(() => {}); toast(`${f.name} gick inte att läsa som ljud.`); }
  }
  if (n) { save(); UI.build(); closeSheet(); toast(n === 1 ? 'Ljudet lades till.' : n + ' ljud lades till.'); }
};
